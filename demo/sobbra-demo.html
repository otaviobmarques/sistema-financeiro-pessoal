<title>Sobbra</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: "cofre de vidro" — barra lateral escura da marca, conteudo em cartoes que sobem em cascata; o heroi verde-floresta guarda o numero que importa. */
:root {
  /* Design System Sobbra Respiro v1.0: paper e white organizam a leitura; butter destaca o resumo; forest orienta acoes */
  --floresta: #123E32; --floresta-2: #0C2E25; --sobbra: #1F6B4F; --menta: #DFE8D6; --ambar: #F0D875; --coral: #A54632; --grafite: #1B2822; --focus: #245CCD;
  --bg: #F5F2E9; --bg-2: #EFEBDF; --card: #FFFFFF; --fg: #1B2822; --muted: #53655B; --line: #E3DED1; --soft: #DFE8D6; --chip: #F1EEE4; --butter: #F0D875;
  --accent-fg: #123E32; --glow: transparent; --shadow: 0 1px 2px rgba(27,40,34,.05);
  --f-display: "Tinos", "Liberation Serif", Georgia, serif; --f-body: "Arimo", "Liberation Sans", Arial, sans-serif;
  --r: 24px; --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1F1A; --bg-2: #13261F; --card: #16291F; --fg: #ECEFE6; --muted: #A9B8AD; --line: #2A3D33; --soft: #20372B; --chip: #1B3027; --accent-fg: #DFE8D6; --sobbra: #9FD3B8; --coral: #E0846F;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] { --bg: #0F1F1A; --bg-2: #13261F; --card: #16291F; --fg: #ECEFE6; --muted: #A9B8AD; --line: #2A3D33; --soft: #20372B; --chip: #1B3027; --accent-fg: #DFE8D6; --sobbra: #9FD3B8; --coral: #E0846F;
  --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit }
button { cursor: pointer }
a { color: inherit }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px }
h1, h2, h3 { text-wrap: balance; margin: 0 }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.9rem, 5vw, 2.6rem); line-height: 1.1; letter-spacing: -.01em }
h1 i { font-style: italic }
h2 { font-size: 1rem; font-weight: 600 }
.muted { color: var(--muted) } .pos { color: var(--sobbra) } .neg { color: var(--coral) }
.small { font-size: 12px }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600 }

/* Estrutura */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100% }
.side { position: sticky; top: 0; height: 100vh; padding: 22px 14px; background: var(--card); border-right: 1px solid var(--line); color: var(--fg); overflow-y: auto; display: flex; flex-direction: column; gap: 2px; overflow: hidden }

.brand { display: flex; align-items: center; gap: 10px; padding: 0 10px 18px; font-family: var(--f-body); font-weight: 700; font-size: 1.5rem; letter-spacing: -.03em; color: var(--accent-fg) }
.brand b { color: #D9B640 }
.nav-label { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 14px 12px 6px; font-weight: 700 }
.side a { position: relative; display: flex; align-items: center; gap: 11px; min-height: 42px; padding: 0 12px; border-radius: 12px; text-decoration: none; font-weight: 700; color: var(--muted); transition: background .2s, color .2s }
.side a[data-badge]::after { content: attr(data-badge); margin-left: auto; background: var(--coral); color: #fff; border-radius: 999px; font-size: 11px; font-weight: 700; padding: 1px 7px }
.side a:hover { background: var(--chip); color: var(--fg) }
.side a[aria-current="page"] { background: var(--soft); color: var(--accent-fg) }

.side svg { width: 19px; height: 19px; flex: none }
.side .foot { margin-top: auto; font-size: 12px; padding: 10px 12px; color: var(--muted) }
main { padding-block: 26px 130px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1120px; width: 100%; margin: 0 auto; min-width: 0; view-transition-name: page }
.tabs { display: none }

/* Componentes */
.demo { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; border: 1px dashed var(--line); border-radius: 14px; padding: 8px 14px; font-size: 13px; margin-bottom: 18px; background: color-mix(in srgb, var(--card) 70%, transparent) }
.demo button { background: none; border: 0; padding: 0; text-decoration: underline; color: var(--accent-fg); font-weight: 600 }
.card { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; box-shadow: var(--shadow); transition: transform .35s var(--ease), box-shadow .35s var(--ease) }
.card.lift:hover { border-color: #A6B1A7 }
.grid { display: grid; gap: 14px }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)) } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)) } .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)) }
.span2 { grid-column: span 2 }
.stack { display: flex; flex-direction: column; gap: 12px }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap }
.between { justify-content: space-between }
.grow { flex: 1; min-width: 0 }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.big { font-family: var(--f-body); font-size: 1.45rem; font-weight: 700; letter-spacing: -.02em; line-height: 1.15 }
.btn { color: var(--fg); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); font-weight: 600; transition: transform .15s var(--ease), background .2s, box-shadow .2s; position: relative; overflow: hidden }
.btn:hover { filter: brightness(1.06) }
.btn:active { transform: scale(.96) }
.btn.p { background: var(--floresta); border-color: transparent; color: #fff }
:root[data-theme="dark"] .btn.p, :root[data-theme="dark"] .btn.d { background: #DFE8D6; color: #123E32 }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.p, :root:not([data-theme="light"]) .btn.d { background: #DFE8D6; color: #123E32 } }
.btn.d { background: var(--floresta); border-color: transparent; color: #fff }
.btn.sm { min-height: 36px; font-size: 13px; padding: 0 12px; border-radius: 11px }
.btn.tall { min-height: 104px; flex-direction: column; flex: 1; font-size: 15px; border-radius: 20px }
.btn.tall svg { width: 30px; height: 30px }
.ripple { position: absolute; border-radius: 50%; transform: scale(0); background: rgba(255,255,255,.45); animation: ripple .55s ease-out forwards; pointer-events: none }
@keyframes ripple { to { transform: scale(3); opacity: 0 } }
.input { min-height: 52px; width: 100%; border-radius: 16px; border: 1px solid var(--line); background: var(--card); padding: 0 14px; transition: border-color .2s, box-shadow .2s }
.input:focus { outline: none; box-shadow: 0 0 0 3px var(--focus) }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 500; min-width: 0 }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--chip); padding: 4px; border-radius: 14px; border: 1px solid var(--line) }
.seg button { min-height: 42px; border: 0; border-radius: 10px; background: transparent; font-weight: 600; transition: background .25s, color .25s }
.seg button.on.out { background: var(--coral); color: #fff } .seg button.on.in { background: var(--sobbra); color: #fff } .seg button.on.tr { background: var(--floresta); color: #fff }
.term { background: none; border: 0; padding: 0; text-decoration: underline dotted; text-underline-offset: 4px; color: inherit; font: inherit }
.tip { font-size: 12px; background: var(--grafite); color: #fff; padding: 8px 10px; border-radius: 10px; margin-top: 6px; max-width: 280px }
.list { list-style: none; margin: 0; padding: 0 }
.list li { display: flex; align-items: center; gap: 12px; padding: 11px 4px; border-top: 1px solid var(--line); min-width: 0; transition: background .2s }
.list li:first-child { border-top: 0 }
.list li[data-drill]:hover, .list li[data-q]:hover { background: var(--chip); border-radius: 10px }
.ico { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font-size: 18px; flex: none }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none }
.pill { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--chip); white-space: nowrap }
.pill.ok { background: color-mix(in srgb, var(--sobbra) 18%, transparent); color: var(--accent-fg) }
.pill.bad { background: color-mix(in srgb, var(--coral) 16%, transparent); color: var(--coral) }
.pill.warn { background: color-mix(in srgb, var(--ambar) 22%, transparent); color: #9A6200 }
:root[data-theme="dark"] .pill.warn { color: var(--ambar) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.warn { color: var(--ambar) } }
.totals { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; backdrop-filter: blur(10px); background: color-mix(in srgb, var(--soft) 85%, transparent); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 13px }
.bubble { padding: 10px 14px; border-radius: 18px; max-width: 85%; white-space: pre-line }
.bubble.me { align-self: flex-end; background: var(--floresta); color: #fff; border-bottom-right-radius: 6px }
.bubble.sb { align-self: flex-start; background: var(--soft); border-bottom-left-radius: 6px }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin }
.chips button { flex: none; min-height: 38px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); padding: 0 14px; font-size: 13px; font-weight: 500; transition: border-color .2s, transform .15s }
.chips button:hover { border-color: var(--sobbra) } .chips button:active { transform: scale(.96) }
.fact { font-size: 12px; background: var(--chip); border-radius: 8px; padding: 3px 8px }
.bar { height: 10px; border-radius: 99px; background: var(--chip); overflow: hidden }
.bar > i { display: block; height: 100%; border-radius: 99px; transform-origin: left; animation: growx .9s var(--ease) both; animation-delay: calc(var(--i, 0) * 70ms) }
.bar.pulse > i { animation: growx .9s var(--ease) both, pulse 1.6s ease-in-out 1s infinite }
@keyframes growx { from { transform: scaleX(0) } }
@keyframes pulse { 50% { filter: brightness(1.25); box-shadow: 0 0 14px currentColor } }
.chart svg { width: 100%; height: auto; display: block; overflow: visible }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--f-body) }
.chart .gl { stroke: var(--line) }
.gy { transform-box: fill-box; transform-origin: bottom; animation: growy .8s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms) }
@keyframes growy { from { transform: scaleY(0) } }
.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.3s var(--ease) .15s forwards }
@keyframes draw { to { stroke-dashoffset: 0 } }
.seg-arc { transition: stroke-width .2s, opacity .2s; animation: arc 1s var(--ease) both; animation-delay: calc(var(--i, 0) * 90ms) }
.seg-arc:hover { stroke-width: 26 }
@keyframes arc { from { stroke-dasharray: 0 999 } }
.fadein { animation: fadein .6s ease both; animation-delay: .6s }
@keyframes fadein { from { opacity: .001 } }
.rise { animation: rise .55s var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms) }
@keyframes rise { from { opacity: .001; transform: translateY(14px) scale(.985) } }

/* Heroi */
.hero { color: #123E32; background: var(--butter); border: 0 }
.hero .eyebrow { color: #123E32 }
.hero .num { font-family: var(--f-display); font-weight: 400; font-size: clamp(2.4rem, 7vw, 3.2rem); letter-spacing: -.01em; line-height: 1.05; color: #123E32 }
.hero .chipw { display: inline-flex; gap: 6px; align-items: center; background: rgba(255,255,255,.55); padding: 6px 12px; border-radius: 999px; font-size: 13px; color: #123E32 }
.hero .chart text { fill: #123E32 }
.hero .btn.d { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.25); color: #fff; width: 100%; justify-content: space-between }
.compo { background: #fff; color: #1B2822; border-radius: 18px; padding: 14px; margin-top: 12px }
.compo dl { margin: 0; display: grid; gap: 8px } .compo dl div { display: flex; justify-content: space-between; gap: 10px } .compo dt { font-size: 14px } .compo dd { margin: 0; font-weight: 700 }
.compo .note { background: #DFE8D6; border-radius: 12px; padding: 10px; font-size: 12px; margin-top: 10px }
.credits { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin-top: 4px }
.cr-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; flex-wrap: wrap }
.cr-domma { display: inline-flex; align-items: center; gap: 6px; color: var(--fg) } .cr-domma b { font-size: 17px; display: block; line-height: 1 } .cr-domma small { display: block; font-size: 8px; letter-spacing: .28em; color: #7C6CF2; font-weight: 700 }
.cr-redbox { font-family: Impact, "Arial Black", var(--f-body); font-weight: 900; font-size: 19px; letter-spacing: .02em } .cr-box { color: #0A0A0A }
:root[data-theme="dark"] .cr-box { color: #fff } @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cr-box { color: #fff } }
.side .foot .cr-row { justify-content: flex-start; gap: 6px; min-height: 26px } .side .foot .cr-row .muted { width: 100% }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); z-index: 25; border-radius: 999px; min-height: 56px; padding: 0 22px; display: none }
@media (max-width: 900px) { .fab { display: inline-flex } }
.kpi .spark { position: absolute; right: 16px; bottom: 16px; width: 130px; opacity: .95 }
.kpi .delta { font-size: 12px; font-weight: 600 }
.subnav { display: flex; gap: 6px; overflow-x: auto; padding: 4px; background: var(--chip); border: 1px solid var(--line); border-radius: 16px; margin-bottom: 16px }
.subnav a { flex: none; text-decoration: none; padding: 9px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; color: var(--muted); transition: background .25s, color .25s }
.subnav a[aria-current="page"] { background: var(--card); color: var(--fg); box-shadow: var(--shadow) }
.ring text { font-family: var(--f-display) }
.cal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; overflow-x: auto; padding-bottom: 6px }
.cal i { width: 13px; height: 13px; border-radius: 3px; display: block; animation: rise .4s ease both; animation-delay: calc(var(--i, 0) * 4ms) }
.heat { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; text-align: center }
.heat i { display: block; aspect-ratio: 1; border-radius: 12px; max-width: 100%; animation: rise .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 60ms) }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--grafite); color: #fff; border-radius: 16px; padding: 10px 12px; display: flex; gap: 12px; align-items: center; width: min(440px, calc(100% - 32px)); box-shadow: 0 16px 40px rgba(0,0,0,.3); animation: toastin .4s var(--ease) both }
@keyframes toastin { from { opacity: .001; transform: translate(-50%, 20px) } }
.toast button { background: rgba(255,255,255,.16); color: #fff; border: 0; border-radius: 10px; padding: 8px 12px; font-weight: 600 }
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(5,20,16,.5); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px }
.modal .card { max-width: 380px; width: 100%; animation: rise .35s var(--ease) both }
.drop { border: 2px dashed var(--line); border-radius: var(--r); padding: 22px; transition: border-color .2s, background .2s }
.drop:hover { border-color: var(--sobbra); background: var(--soft) }
.scanwrap { position: relative; overflow: hidden; border-radius: 14px }
.scanwrap.scan::after { content: ""; position: absolute; left: 0; right: 0; height: 3px; background: var(--sobbra); box-shadow: 0 0 18px 4px var(--sobbra); animation: scan 1.4s ease-in-out 2 }
@keyframes scan { 0% { top: 0 } 50% { top: calc(100% - 3px) } 100% { top: 0 } }
.hide .money { filter: blur(8px) }
#fx { position: fixed; inset: 0; pointer-events: none; z-index: 50 }
table { width: 100%; border-collapse: collapse; font-size: 13px }
th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px; padding: 4px }
td { border-top: 1px solid var(--line); padding: 9px 4px }
.scroll { overflow-x: auto }
details > summary { cursor: pointer; list-style: none } details > summary::-webkit-details-marker { display: none }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted) } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px }

/* Agenda */
.agcal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px }
.agcal > b { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; padding-bottom: 2px }
.agday { aspect-ratio: 1; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 2px; transition: transform .15s, border-color .2s, background .2s }
.agday:hover { border-color: var(--sobbra) } .agday:active { transform: scale(.95) }
.agday .n { font-weight: 600; font-size: 14px }
.agday.today .n { background: var(--sobbra); color: #fff; border-radius: 999px; min-width: 26px; height: 26px; display: grid; place-items: center }
.agday.sel { background: var(--soft); border-color: var(--sobbra); box-shadow: 0 0 0 3px var(--glow) }
.evdots { display: flex; gap: 3px; min-height: 6px } .evdots i { width: 6px; height: 6px; border-radius: 50%; display: block }
.quick { display: none }
@media (max-width: 900px) { #toprow, .donutgrid { grid-template-columns: minmax(0, 1fr) !important } #urow { grid-template-columns: minmax(0, 1fr) !important } #agrow { grid-template-columns: minmax(0, 1fr) !important } .quick { display: flex } }
/* Transicao entre telas (View Transitions API) */
::view-transition-old(page) { animation: vt-out .22s ease both }
::view-transition-new(page) { animation: vt-in .38s var(--ease) both }
@keyframes vt-out { to { opacity: 0; transform: translateY(-8px) } }
@keyframes vt-in { from { opacity: 0; transform: translateY(12px) } }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .side { display: none }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--card) 88%, transparent); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px) }
  .tabs a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 62px; font-size: 11px; font-weight: 500; color: var(--muted); text-decoration: none; gap: 3px }
  .tabs a[aria-current="page"] { color: var(--accent-fg) }
  .tabs a[aria-current="page"]::before { content: ""; position: absolute; top: 0; width: 28px; height: 3px; border-radius: 0 0 3px 3px; background: var(--sobbra) }
  .tabs svg { width: 22px; height: 22px }
  .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)) } .g3 { grid-template-columns: minmax(0, 1fr) }
}
@media (max-width: 620px) { .g2 { grid-template-columns: minmax(0, 1fr) } .span2 { grid-column: auto } .big { font-size: 1.3rem } .kpi .spark { display: none } main { padding-top: 16px } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important } .draw { stroke-dashoffset: 0 } }
/* ===== Sobbra Vibe: proposta de visual comercial (substitui o Respiro nesta demonstração) ===== */
:root {
  --floresta: #0B3D2E; --sobbra: #0E9F6E; --emerald: #12B76A; --lime: #B7F34D; --sun: #FFC93C; --violet: #7C5CFF; --sky: #2E9BFF; --coral: #F2545B; --pink: #FF5FA2;
  --bg: #F3F6F4; --card: #FFFFFF; --fg: #0F1E19; --muted: #5E6F68; --line: #E4EAE6; --soft: #E3F8EE; --chip: #EEF3F0; --accent-fg: #0B7A53; --butter: #FFC93C;
  --shadow: 0 1px 2px rgba(15,30,25,.04), 0 10px 30px -14px rgba(15,30,25,.18);
  --f-display: "Plus Jakarta Sans", "Inter", system-ui, sans-serif; --f-body: "Plus Jakarta Sans", "Inter", system-ui, sans-serif; --r: 22px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #07120E; --card: #0F1D18; --fg: #EAF4EF; --muted: #95ABA2; --line: #1D2F28; --soft: #10301F; --chip: #142721; --accent-fg: #3DDC97; --sobbra: #3DDC97; --coral: #FF7A80; color-scheme: dark } }

function load() { try { const raw = localStorage.getItem(KEY); if (raw) { S = JSON.parse(raw); S.budgets ||= {}; S.goals ||= []; return; } } catch {} seed(); }

// ---------- Regras financeiras (portadas do sistema) ----------
const live = () => S.tx.filter((t) => !t.deleted);
const acc = (id) => S.accounts.find((a) => a.id === id);
function invMonth(t) { const a = acc(t.acc); return a && a.type === "CREDIT_CARD" ? SB.invoiceMonthFor(parseD(t.date), a.closing) : null; }
function balance(a, asOf = todayIso) {
  let b = a.initial;
  for (const t of live()) {
    if (t.status !== "PAID" || t.date > asOf) continue;
    if (t.acc === a.id) b += t.type === "INCOME" ? t.amount : -t.amount;
    if (t.to === a.id) b += t.amount;
  }
  return b;
}
function invoices(cardId) {
  const card = acc(cardId);
  const by = {};
  for (const t of live()) if (t.acc === cardId && t.type !== "TRANSFER") { const k = invMonth(t); (by[k] = by[k] || []).push(t); }
  let pool = live().filter((t) => t.to === cardId && t.type === "TRANSFER").reduce((s, t) => s + t.amount, 0);
  const open = SB.invoiceMonthFor(TODAY, card.closing);
  const list = Object.keys(by).sort().map((k) => {
    const items = by[k].sort((a, b) => b.date.localeCompare(a.date));
    const total = items.reduce((s, t) => s + (t.type === "EXPENSE" ? t.amount : -t.amount), 0);
    const paid = Math.min(Math.max(pool, 0), total); pool -= total;
    const status = paid >= total && total > 0 ? "paga" : k < open ? "fechada" : k === open ? "aberta" : "futura";
    return { month: k, items, total, paid, status, dueDate: SB.invoiceDueDate(k, card.closing, card.due) };
  });
  list.sort((a, b) => (a.status === "futura") !== (b.status === "futura") ? (a.status === "futura" ? 1 : -1) : a.status === "futura" ? a.month.localeCompare(b.month) : b.month.localeCompare(a.month));
  const used = list.reduce((s, i) => s + i.total - i.paid, 0);
  return { card, list, used, open };
}
function classify(text, kind) {
  const k = SB.keyOf(text);
  const rule = S.rules.find((r) => CATS[r.cat]?.kind === kind && k.includes(r.match));
  if (rule) return { cat: rule.cat, conf: 0.99 };
  const mem = S.memory[SB.keyOf(SB.normalizeMerchant(text))];
  if (mem && CATS[mem]?.kind === kind) return { cat: mem, conf: 0.9 };
  const slug = SB.keywordSlug(text, kind);
  if (slug) return { cat: slug, conf: 0.85 };
  return { cat: kind === "INCOME" ? "receita.outros" : "outros.geral", conf: 0.3 };
}
function addMonths(s, n) { const d = parseD(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return iso(d); }
function createTx(t) {
  const n = t.insts > 1 ? Math.min(t.insts, 48) : 1;
  const ids = [];
  const isCard = acc(t.acc)?.type === "CREDIT_CARD";
  if (t.cat && t.merchant) S.memory[SB.keyOf(t.merchant)] = t.cat;
  if (t.rec && n <= 1) {
    const g = uid(), N = t.recN || 12;
    for (let i = 0; i < N; i++) { const date = addMonths(t.date, i); const id = uid(); ids.push(id);
      S.tx.push({ tags: [], origin: i ? "RECURRENCE" : "MANUAL", ...t, origin: i ? "RECURRENCE" : t.origin || "MANUAL", id, date, rec: true, group: g, status: isCard || date <= todayIso ? "PAID" : "PENDING" }); }
    save(); return ids;
  }
  if (n > 1) {
    const each = Math.floor(t.amount / n), rest = t.amount - each * n, g = uid();
    for (let i = 0; i < n; i++) { const date = addMonths(t.date, i); const id = uid(); ids.push(id);
      S.tx.push({ ...t, id, amount: each + (i ? 0 : rest), date, desc: `${t.desc} (${i + 1}/${n})`, inst: i + 1, insts: n, group: g, status: isCard || date <= todayIso ? "PAID" : "PENDING" }); }
  } else { const id = uid(); ids.push(id); S.tx.push({ status: t.date > todayIso ? "PENDING" : "PAID", tags: [], origin: "MANUAL", ...t, id }); }
  save(); return ids;
}
function dashboard(month) {
  const [y, m] = month.split("-").map(Number);
  const start = iso(new Date(y, m - 1, 1)), end = iso(new Date(y, m, 0));
  const isCur = month === mk(TODAY);
  const T = live().filter((t) => t.type !== "TRANSFER");
  const inM = T.filter((t) => t.date >= start && t.date <= end);
  const income = inM.filter((t) => t.type === "INCOME").reduce((s, t) => s + t.amount, 0);
  const expense = inM.filter((t) => t.type === "EXPENSE").reduce((s, t) => s + t.amount, 0);
  const cash = S.accounts.filter((a) => a.type !== "CREDIT_CARD" && a.type !== "INVESTMENT");
  const cashIds = new Set(cash.map((a) => a.id));
  const atual = cash.reduce((s, a) => s + balance(a), 0);
  const pend = T.filter((t) => cashIds.has(t.acc) && t.date <= end && (t.status === "PENDING" || t.date > todayIso));
  const pin = pend.filter((t) => t.type === "INCOME").reduce((s, t) => s + t.amount, 0);
  const pout = pend.filter((t) => t.type === "EXPENSE").reduce((s, t) => s + t.amount, 0);
  const monthStart = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  let cardsDue = 0;
  for (const c of S.accounts.filter((a) => a.type === "CREDIT_CARD")) for (const i of invoices(c.id).list) if (i.dueDate <= parseD(end) && i.dueDate >= (isCur ? monthStart : parseD(start))) cardsDue += i.total - i.paid;
  const previsto = atual + pin - pout - cardsDue;
  const dim = Number(end.slice(8)), dayNow = isCur ? TODAY.getDate() : dim, left = Math.max(0, dim - dayNow);
  const variable = inM.filter((t) => t.type === "EXPENSE" && !t.rec && !t.insts && t.date <= todayIso).reduce((s, t) => s + t.amount, 0);
  const projecao = previsto - Math.round((dayNow ? variable / dayNow : 0) * left);
  const next = pend.filter((t) => t.type === "INCOME" && t.date > todayIso).sort((a, b) => a.date.localeCompare(b.date))[0];
  const days = next ? Math.max(1, Math.round((parseD(next.date) - TODAY) / 864e5)) : Math.max(1, left + 1);
  const porDia = Math.max(0, Math.floor(previsto / days));
  const exp = T.filter((t) => t.type === "EXPENSE");
  const sumBy = (list) => { const o = {}; for (const t of list) { const k = top(t.cat)?.slug || "sem"; o[k] = (o[k] || 0) + t.amount; } return o; };
  const mOf = (t) => t.date.slice(0, 7);
  const prevK = mk(new Date(y, m - 2, 1)), last3 = [1, 2, 3].map((i) => mk(new Date(y, m - 1 - i, 1)));
  const cur = sumBy(exp.filter((t) => mOf(t) === month)), prev = sumBy(exp.filter((t) => mOf(t) === prevK)), avg = sumBy(exp.filter((t) => last3.includes(mOf(t))));
  const categories = Object.entries(cur).map(([k, total]) => ({ slug: k, name: CATS[k]?.name || "Sem categoria", icon: CATS[k]?.icon || "❔", color: CATS[k]?.color || "#94A3B8", total, pct: expense ? total / expense : 0, prev: prev[k] || 0, avg3: Math.round((avg[k] || 0) / 3) })).sort((a, b) => b.total - a.total);
  const mer = {}; for (const t of exp.filter((t) => mOf(t) === month)) { const k = t.merchant || t.desc.replace(/\s*\(\d+\/\d+\)$/, ""); mer[k] = (mer[k] || 0) + t.amount; }
  const merchants = Object.entries(mer).map(([name, total]) => ({ name, total })).sort((a, b) => b.total - a.total).slice(0, 6);
  const monthly = Array.from({ length: 6 }, (_, i) => { const k = mk(new Date(y, m - 6 + i, 1)); return { k, inc: T.filter((t) => t.type === "INCOME" && mOf(t) === k).reduce((s, t) => s + t.amount, 0), exp: exp.filter((t) => mOf(t) === k).reduce((s, t) => s + t.amount, 0) }; });
  let run = cash.reduce((s, a) => s + balance(a, iso(new Date(y, m - 1, 0))), 0);
  const daily = new Array(dim).fill(0);
  for (const t of inM) if (cashIds.has(t.acc)) daily[Number(t.date.slice(8)) - 1] += t.type === "INCOME" ? t.amount : -t.amount;
  for (const t of live()) if (t.type === "TRANSFER" && t.date >= start && t.date <= end) { const di = Number(t.date.slice(8)) - 1; if (cashIds.has(t.acc)) daily[di] -= t.amount; if (cashIds.has(t.to)) daily[di] += t.amount; }
  const line = daily.map((v, i) => { run += v; return { day: i + 1, v: run, fut: isCur && i + 1 > dayNow }; });
  const week = [0, 0, 0, 0, 0, 0, 0]; for (const t of inM) if (t.type === "EXPENSE") week[parseD(t.date).getDay()] += t.amount;
  return { month, income, expense, atual, previsto, projecao, porDia, days, categories, merchants, monthly, line, week, pin, pout, cardsDue };
}


// ---------- Interpretador de voz + consultor (mesma logica do sistema) ----------
function voice(text, pending) {
  const names = S.accounts.map((a) => a.name);
  let action = SB.parseVoice(text, names, TODAY);
  if (pending) {
    const item = { ...pending.item, date: new Date(pending.item.date) };
    const e = SB.parseVoice(text, names, TODAY); const x = e.kind === "create" ? e.items[0] : null;
    if (pending.ask === "descricao") item.description = x?.description || text.trim();
    if (pending.ask === "valor" && x?.amountCents) item.amountCents = x.amountCents;
    item.missing = item.missing.filter((m) => m !== pending.ask); action = { kind: "create", items: [item] };
  }
  if (action.kind === "query") return { say: advisor(text).text };
  const lastVoice = () => [...live()].reverse().find((t) => t.origin === "VOICE" && t.mine);
  if (action.kind === "undo") { const l = lastVoice(); if (!l) return { say: "Não encontrei nenhum lançamento por voz para mexer." }; S.tx.forEach((t) => { if (t.id === l.id || (l.group && t.group === l.group)) t.deleted = true; }); save(); return { say: `Apaguei "${l.desc}" de ${brl(l.amount)}.` }; }
  if (action.kind === "fix_amount") { const l = lastVoice(); if (!l) return { say: "Não encontrei nenhum lançamento por voz para mexer." }; l.amount = action.amountCents; save(); return { say: `Corrigi "${l.desc}" para ${brl(l.amountCents ?? l.amount)}.` }; }
  const out = [], ids = [];
  for (const it of action.items) {
    if (it.missing.includes("valor")) return { say: `Qual foi o valor${it.description ? ` de ${it.description}` : ""}?`, pending: { item: it, ask: "valor" } };
    if (it.missing.includes("descricao")) return { say: `Com o que foi esse gasto de ${brl(it.amountCents)}?`, pending: { item: it, ask: "descricao" } };
    let a = S.accounts.find((x) => x.name === it.accountName);
    if (!a && it.payment === "credito") a = S.accounts.find((x) => x.type === "CREDIT_CARD");
    if (!a && it.payment === "dinheiro") a = S.accounts.find((x) => x.type === "WALLET");
    if (!a && it.installments) a = S.accounts.find((x) => x.type === "CREDIT_CARD");
    if (!a) a = S.accounts.find((x) => x.type === "CHECKING") || S.accounts[0];
    const desc = it.description.charAt(0).toUpperCase() + it.description.slice(1);
    const c = classify(desc, it.type);
    ids.push(...createTx({ type: it.type, amount: it.amountCents, desc, merchant: SB.normalizeMerchant(desc), cat: c.cat, conf: c.conf, acc: a.id, date: iso(it.date), insts: it.installments, origin: "VOICE", mine: true }));
    const dd = Math.round((TODAY - new Date(it.date.getFullYear(), it.date.getMonth(), it.date.getDate(), 12)) / 864e5);
    const how = a.type === "CREDIT_CARD" ? `na fatura do ${a.name}` : a.type === "WALLET" ? "no dinheiro" : `no ${a.name}`;
    out.push(`${brl(it.amountCents)} em ${catLabel(c.cat).replace(" › ", " > ")}, ${dd === 0 ? "hoje" : dd === 1 ? "ontem" : it.date.toLocaleDateString("pt-BR")}, ${how}${it.installments ? ` em ${it.installments}x` : ""}`);
  }
  return { say: out.length === 1 ? `Pronto! ${out[0]}.` : `Lancei ${out.length}: ${out.join("; ")}.`, ids };
}
function advisor(q) {
  const t = SB.keyOf(q); const d = dashboard(mk(TODAY)); const pct = (a, b) => (b ? Math.round(((a - b) / b) * 100) : 0);
  const mName = MONTHS[TODAY.getMonth()];
  if (/(posso|consigo) gastar|ainda posso/.test(t)) return { text: d.previsto > 0 ? `Você pode gastar cerca de ${brl(d.porDia)} por dia ${d.days === 1 ? "até amanhã" : `nos próximos ${d.days} dias`}, sem ficar no vermelho.` : `Pelas contas já agendadas, o mês fecha em ${brl(d.previsto)}. O ideal agora é segurar o que dá para adiar.`, facts: [["Saldo atual", brl(d.atual)], ["Previsto no fim do mês", brl(d.previsto)]] };
  if (/sobrar|sobra/.test(t)) return { text: `Se você mantiver o ritmo atual, devem sobrar ${brl(d.projecao)} no fim do mês.`, facts: [["Contas agendadas", brl(d.previsto)], ["Pelo ritmo de gasto", brl(d.projecao)]] };

    const rising = d.categories.filter((c) => c.avg3 > 0 && c.total > c.avg3 * 1.15).slice(0, 3); const pts = [];
    for (const c of rising) pts.push(`${c.icon} ${c.name} está ${pct(c.total, c.avg3)}% acima da sua média (${brl(c.total)} contra ${brl(c.avg3)}).`);
    const subs = d.categories.find((c) => c.slug === "assinaturas"); if (subs) pts.push(`📺 São ${brl(subs.total)} em assinaturas este mês. Vale conferir se você usa todas.`);
    const del = live().filter((x) => x.cat === "alimentacao.delivery" && x.date.slice(0, 7) === mk(TODAY)); if (del.length >= 2) pts.push(`🛵 ${del.length} pedidos de delivery este mês, somando ${brl(del.reduce((s, x) => s + x.amount, 0))}.`);
    if (d.expense > d.income && d.income) pts.push(`⚠️ Os gastos (${brl(d.expense)}) passaram do que entrou (${brl(d.income)}).`);
    return { text: pts.length ? `Separei alguns pontos de atenção, sem julgamento:\n• ${pts.join("\n• ")}` : "Não encontrei nada fora do padrão este mês. Continue assim!", facts: rising.map((c) => [c.name, `+${pct(c.total, c.avg3)}%`]) };
  }
  if (/quanto (gastei|paguei)|gastei com|gasto com/.test(t)) {
    const passado = /mes passado/.test(t); const k = passado ? mk(new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, 1)) : mk(TODAY);
    const term = t.replace(/.*(gastei|paguei|gasto)\s*(com|de|no|na|em)?\s*/, "").replace(/\b(em|no mes|este mes|esse mes|neste mes|mes passado)\b.*$/, "").replace(/\?/g, "").trim();
    const hit = live().filter((x) => x.type === "EXPENSE" && x.date.slice(0, 7) === k && (!term || SB.keyOf([x.desc, x.merchant, catLabel(x.cat)].join(" ")).includes(term)));
    const tot = hit.reduce((s, x) => s + x.amount, 0);
    return { text: `Em ${MONTHS[Number(k.slice(5)) - 1]} você gastou ${brl(tot)}${term ? ` com "${term}"` : ""}, em ${hit.length} lançamento${hit.length === 1 ? "" : "s"}.`, facts: [["Total", brl(tot)], ["Lançamentos", String(hit.length)]] };

const MUTE = { "#12B76A": "#6FBF9C", "#18C77A": "#6FBF9C", "#0B8A5C": "#4E8F75", "#7C5CFF": "#8E95A8", "#2E9BFF": "#94B4CF", "#FFB31F": "#C9B68A", "#FFC93C": "#CDBB8C", "#FFD65C": "#D2C59A", "#FF5FA2": "#C79AAE", "#F2545B": "#D08C8C", "#0B7A53": "#5F8F7B", "#00B8D9": "#8DBDC6", "#9B8CFF": "#ABA9C4", "#FF8A3D": "#CFA488", "#B7F34D": "#A3AAA6", "#C9A63A": "#8E95A8" };
const MUTE_RE = new RegExp(Object.keys(MUTE).join("|"), "gi");
const skinOf = () => (S.prefs.skin === "sutil" ? "sutil" : "vibe");
const tone = (html) => (skinOf() === "sutil" ? html.replace(MUTE_RE, (m) => MUTE[m.toUpperCase()]) : html);
const skinSwitch = () => `<div class="skinsw" role="group" aria-label="Estilo de cores"><button type="button" data-skin="vibe" aria-pressed="${skinOf() === "vibe"}">Vibrante</button><button type="button" data-skin="sutil" aria-pressed="${skinOf() === "sutil"}">Sutil</button></div>`;
function render(anim = true) {
  document.documentElement.dataset.skin = skinOf();
  const dest = destOf(view); const un = unreadCount();
  const SIDE_SKIP = { plano: "plano", mais: "mais", lancamentos: "lancamentos" };
  S.prefs.navOpen ||= { lancamentos: true, plano: true, mais: true, admin: true };
  const ADMIN = [["usuarios", "Cadastro de usuários"], ["planos", "Planos e preços"], ["pagamentos", "Pagamentos"], ["site", "Página de vendas"]];
  const subOf = (id) => id === "admin" ? ADMIN : GROUP[id].filter(([s]) => s !== SIDE_SKIP[id] && !["usuarios", "planos", "pagamentos"].includes(s));

/** Comandos de agenda por voz/texto: "marcar dentista amanhã às 15h", "lembrar de pagar a escola dia 10". */
function parseAgenda(text) {
  const t = SB.keyOf(text);
  if (!/^(marcar|marca|agendar|agenda|lembrar|lembra|lembre|me lembra|me lembre)\b/.test(t)) return null;
  const d = new Date(TODAY); let said = false;
  if (/depois de amanha/.test(t)) { d.setDate(d.getDate() + 2); said = true; } else if (/amanha/.test(t)) { d.setDate(d.getDate() + 1); said = true; }
  const dm = t.match(/\bdia (\d{1,2})\b/); if (dm) { d.setDate(Number(dm[1])); if (d < TODAY) d.setMonth(d.getMonth() + 1); said = true; }
  const wd = t.match(/\b(domingo|segunda|terca|quarta|quinta|sexta|sabado)\b/); if (wd && !said) { const idx = ["domingo", "segunda", "terca", "quarta", "quinta", "sexta", "sabado"].indexOf(wd[1]); let diff = (idx - d.getDay() + 7) % 7 || 7; d.setDate(d.getDate() + diff); }
  const hm = t.match(/\b(?:as|a|para as)\s*(\d{1,2})(?:h|:)?(\d{2})?\s*(?:h|horas)?\b/); const time = hm ? `${pad(Math.min(23, Number(hm[1])))}:${hm[2] || "00"}` : "";
  const isLembrete = /^(lembrar|lembra|lembre|me lembra|me lembre)/.test(t); const isConta = /\b(pagar|conta|boleto|fatura)\b/.test(t);
  const amt = t.match(/\b(\d+(?:[.,]\d{1,2})?)\s*(?:reais)\b/);
  const B = "(?=\\s|$|[,.!?])"; const W = (s) => new RegExp("(^|\\s)" + s + B, "gi");
  let title = text.replace(/^\s*(me\s+)?(marcar|marca|agendar|agenda|lembrar|lembra|lembre)\s+(de\s+|que\s+)?/i, "").replace(W("(depois de amanhã|depois de amanha|amanhã|amanha|hoje)"), " ").replace(W("(às|as|para as)\\s*\\d{1,2}(h|:)?(\\d{2})?\\s*(h|horas)?"), " ").replace(/\b(dia \d{1,2}|na |no )?(domingo|segunda|terça|terca|quarta|quinta|sexta|sábado|sabado)(-feira)?\b/gi, "").replace(/\bdia \d{1,2}\b/gi, "").replace(/\b(às|as|para as)\s*\d{1,2}(h|:)?(\d{2})?\s*(h|horas)?\b/gi, "").replace(/\b\d+(?:[.,]\d{1,2})?\s*reais\b/gi, "").replace(/\s+/g, " ").trim();
  title = title.charAt(0).toUpperCase() + title.slice(1);
  return { id: uid(), title: title || "Compromisso", type: isConta ? "conta" : isLembrete ? "lembrete" : "compromisso", date: iso(d), time, amount: amt ? Math.round(Number(amt[1].replace(",", ".")) * 100) : undefined };
}

function repRange() {

// ---------- Fase 2 na demonstracao: dividas, contas a pagar, importacao, avisos e simulacoes ----------
function seedF2() {
  const d = (n) => iso(new Date(TODAY.getTime() + n * 864e5));
  S.debts ||= [
    { id: uid(), type: "CARTAO_ROTATIVO", creditor: "Rotativo do cartão", balanceCents: 180000, monthlyRate: 12.9, paymentCents: 35000, dueDay: 10 },
    { id: uid(), type: "EMPRESTIMO_PESSOAL", creditor: "Empréstimo pessoal", balanceCents: 620000, monthlyRate: 3.2, paymentCents: 42000, dueDay: 15 },
  ];
  S.bills ||= [{ id: uid(), payee: "Escola de inglês", amount: 45000, due: d(1), line: null, paid: false }, { id: uid(), payee: "Conta de água", amount: 8990, due: d(4), line: null, paid: false }];
  S.readAlerts ||= [];
}
const simMonthly = () => { const ks = lastN(4, mk(TODAY)).slice(0, 3); const inc = ks.reduce((s, k) => s + sumMonth(k, (t) => t.type === "INCOME"), 0) / 3, exp = ks.reduce((s, k) => s + sumMonth(k, (t) => t.type === "EXPENSE"), 0) / 3; return { inc: Math.round(inc), exp: Math.round(exp), sobra: Math.round(inc - exp), ks }; };
const _advisorBase = advisor;
advisor = function (q) {
  const t = SB.keyOf(q); const cut = SB.parseCut(q), buy = SB.parsePurchase(q), hz = SB.parseHorizon(q); const avg = simMonthly();
  if (/(me ajud|ajude|monta|montar|faz|fazer).*(organiz|plano)/.test(t)) {
    seedF2(); const dear = [...S.debts].filter((x) => x.balanceCents > 0).sort((a, b) => b.monthlyRate - a.monthlyRate)[0]; const reserve = avg.exp * 3;
    const steps = [dear ? `Dívidas primeiro: comece por ${dear.creditor} (${String(dear.monthlyRate).replace(".", ",")}% ao mês). Veja o plano em Dívidas.` : null,
      `Reserva de emergência: junte ${brl(reserve)} (3 meses do seu gasto médio). Guardando ${brl(Math.round(avg.sobra / 2))} por mês, chega lá em ${Math.ceil(reserve / Math.max(1, avg.sobra / 2))} meses.`,
      "Orçamentos: use os limites sugeridos pela sua média em Painéis > Orçamentos."].filter(Boolean);
    return { text: `Montei um plano em ${steps.length} passos:\n${steps.map((x, i) => `${i + 1}. ${x}`).join("\n")}`, facts: [["Entra por mês (média)", brl(avg.inc)], ["Sai por mês (média)", brl(avg.exp)], ["Costuma sobrar", brl(avg.sobra)]] };
  }
  if (cut) {
    const k = SB.keyOf(cut.term); const spend = Math.round(live().filter((x) => x.type === "EXPENSE" && avg.ks.includes(x.date.slice(0, 7)) && SB.keyOf([x.desc, x.merchant, catLabel(x.cat)].join(" ")).includes(k)).reduce((s, x) => s + x.amount, 0) / 3);
    const save = Math.round(spend * cut.fraction), m = hz ?? 6;
    return spend ? { text: `Você gasta em média ${brl(spend)} por mês com "${cut.term}". ${cut.fraction === 1 ? "Parando" : `Cortando ${Math.round(cut.fraction * 100)}%`}, sobram ${brl(save)} a mais por mês: ${brl(save * m)} em ${m} meses e ${brl(save * 12)} em um ano.`, facts: [["Gasto médio por mês", brl(spend)], ["Economia por mês", brl(save)], [`Em ${m} meses`, brl(save * m)]] }
      : { text: `Não encontrei gastos com "${cut.term}" nos últimos 3 meses. Tente: delivery, mercado, uber.`, facts: [] };
  }
  if (buy) {
    const parcel = Math.ceil(buy.amountCents / buy.installments); const fits = avg.sobra >= parcel * 1.2, tight = !fits && avg.sobra >= parcel;
    return { text: fits ? `Cabe, sim. ${buy.installments > 1 ? `A parcela de ${brl(parcel)}` : `Os ${brl(buy.amountCents)}`} cabe${buy.installments > 1 ? "" : "m"} no que costuma sobrar (${brl(avg.sobra)} por mês).` : tight ? `Cabe, mas fica apertado: a parcela de ${brl(parcel)} usa quase tudo o que sobra (${brl(avg.sobra)}).` : `Hoje não cabe com folga: passa do que costuma sobrar (${brl(avg.sobra)} por mês). Guardando essa sobra, você junta em ${Math.ceil(buy.amountCents / Math.max(1, avg.sobra))} meses.`,
      facts: [[buy.installments > 1 ? `Parcela (${buy.installments}x)` : "Valor", brl(parcel)], ["Costuma sobrar", brl(avg.sobra)]] };
  }
  if (hz) return { text: `No ritmo dos últimos 3 meses, sobram em média ${brl(avg.sobra)} por mês: ${brl(avg.sobra * hz)} em ${hz} meses.`, facts: [["Sobra média por mês", brl(avg.sobra)], [`Em ${hz} meses`, brl(avg.sobra * hz)]] };
  return _advisorBase(q);
};

  else if (ds.pay) { const [cid, v] = ds.pay.split("|"); createTx({ type: "TRANSFER", amount: Number(v), desc: `Pagamento fatura ${acc(cid).name}`, acc: "itau", to: cid, date: todayIso }); render(false); toast("Fatura paga! Uma conta a menos."); coins(); }
  else if (ds.act === "reset") { $("#layer").innerHTML = `<div class="modal"><div class="card stack"><b>Recomeçar com os dados de exemplo?</b><p class="muted small" style="margin:0">O que você lançou nesta demonstração será apagado.</p><div class="row"><button class="btn p" id="ok">Recomeçar</button><button class="btn" id="no">Voltar</button></div></div></div>`;
    $("#ok").onclick = () => { seed(); save(); voiceLog = []; lastIds = null; $("#layer").innerHTML = ""; go(() => render()); }; $("#no").onclick = () => ($("#layer").innerHTML = ""); }
  else if (ds.act === "mode") go(() => { S.prefs.simple = !S.prefs.simple; save(); render(); });
  else if (ds.act === "hide") { S.prefs.hide = !S.prefs.hide; save(); render(false); }
  else if (ds.act === "clearf") { filt = { q: "", cat: "", acc: "" }; render(false); }
  else if (ds.act === "undovoice") { S.tx.forEach((t) => { if (lastIds.includes(t.id)) t.deleted = true; }); lastIds = null; save(); voiceLog.push({ text: "Desfeito. Nada foi lançado." }); render(false); }
  else if (ds.act === "discard") { S.receipts = S.receipts.filter((x) => x.done); save(); render(false); }
});

document.addEventListener("click", (e) => {
  const o = e.target.closest("[data-orc]"), g = e.target.closest("[data-goal]"), gi = e.target.closest("[data-gicon]");
  if (gi) { $("#gf-icon").value = gi.dataset.gicon; document.querySelectorAll("[data-gicon]").forEach((b) => { const on = b === gi; b.setAttribute("aria-pressed", on); b.style.outline = on ? "2px solid var(--sobbra)" : ""; }); return; }
  if (o) { const a = o.dataset.orc;
    if (a === "avg") { const opt = $("#bf-cat").selectedOptions[0]; $("#bf-val").value = (Math.ceil(Number(opt.dataset.avg) / 1000) * 10).toString(); return; }
    if (a === "new") orcForm = { slug: null }; else if (a === "edit") orcForm = { slug: o.dataset.slug }; else if (a === "cancel") orcForm = null;
    else if (a === "del") { if (!confirm(`Excluir o orçamento de ${CATS[o.dataset.slug].name}?`)) return; delete S.budgets[o.dataset.slug]; orcForm = null; save(); toast("Orçamento excluído"); }
    render(false); if (orcForm) { const f = $("#orcform"); f?.scrollIntoView({ block: "center", behavior: "smooth" }); $("#bf-val")?.focus(); } return; }
  if (g) { const a = g.dataset.goal;
    if (a === "new") { goalForm = { id: null }; goalAdd = null; } else if (a === "edit") { goalForm = { id: g.dataset.id }; goalAdd = null; } else if (a === "cancel") goalForm = null;
    else if (a === "add") goalAdd = g.dataset.id; else if (a === "addcancel") goalAdd = null;
    else if (a === "del") { const x = S.goals.find((z) => z.id === g.dataset.id); if (!confirm(`Excluir a meta "${x.name}"?`)) return; S.goals = S.goals.filter((z) => z.id !== x.id); goalForm = null; save(); toast("Meta excluída"); }
    render(false); if (goalForm) { $("#gform")?.scrollIntoView({ block: "center", behavior: "smooth" }); $("#gf-name")?.focus(); } if (goalAdd) $("#ga-val")?.focus(); }
});
document.addEventListener("change", (e) => { if (e.target.id !== "bf-cat") return; const avg = Number(e.target.selectedOptions[0].dataset.avg); $("#bf-hint").innerHTML = avg ? `Sua média nos últimos 3 meses: <b class="money">${brl(avg)}</b>. <button type="button" class="term" data-orc="avg">Usar a média</button>` : "Sem gastos nessa categoria nos últimos 3 meses."; });
document.addEventListener("submit", (e) => {
  const id = e.target.id; if (!["orcform", "gform", "gaform"].includes(id)) return; e.preventDefault(); e.stopImmediatePropagation();
  const fail = (el, msg) => { el.textContent = msg; el.hidden = false; };
  if (id === "orcform") { const slug = $("#bf-cat").value, v = SB.parseMoney($("#bf-val").value || "");
    if (!v || v <= 0) return fail($("#bf-err"), "Informe um limite maior que zero.");
    const isNew = S.budgets[slug] == null; S.budgets[slug] = v; orcForm = null; save(); render(false); toast(isNew ? "Orçamento criado" : "Orçamento atualizado"); }
  if (id === "gform") { const name = $("#gf-name").value.trim(), target = SB.parseMoney($("#gf-target").value || ""), saved = SB.parseMoney($("#gf-saved").value || "0") || 0, due = $("#gf-due").value, icon = $("#gf-icon").value;
    if (!name) return fail($("#gf-err"), "Dê um nome para a meta.");
    if (!target || target <= 0) return fail($("#gf-err"), "Informe quanto quer juntar.");
    if (saved < 0) return fail($("#gf-err"), "O valor já guardado não pode ser negativo.");
    if (goalForm.id) Object.assign(S.goals.find((x) => x.id === goalForm.id), { name, target, saved, due, icon }); else S.goals.push({ id: uid(), name, target, saved, due, icon });
    const was = !!goalForm.id; goalForm = null; save(); render(false); toast(was ? "Meta atualizada" : "Meta criada"); }
  if (id === "gaform") { const g = S.goals.find((x) => x.id === e.target.dataset.id), v = SB.parseMoney($("#ga-val").value || "");
    if (!v) return; const before = g.saved; g.saved = Math.max(0, g.saved + v); goalAdd = null; save(); render(false);
    toast(v > 0 ? `${brl(v)} guardados em ${g.name}` : `${brl(-v)} retirados de ${g.name}`); if (before < g.target && g.saved >= g.target && typeof celebrate === "function") celebrate(); }
}, true);
document.addEventListener("click", (e) => { const b = e.target.closest("[data-navtg]"); if (!b) return; const id = b.dataset.navtg; S.prefs.navOpen ||= {}; S.prefs.navOpen[id] = !(S.prefs.navOpen[id] !== false); save(); render(false); document.querySelector(`.nav-tg[data-navtg="${id}"]`)?.focus(); });
function commitBudget(inp) { const v = SB.parseMoney(inp.value || ""); if (v && v > 0) S.budgets[inp.dataset.slug] = v; editBudget = null; save(); render(false); }
document.addEventListener("keydown", (e) => { if (e.target.id === "b-edit" && e.key === "Enter") { e.preventDefault(); commitBudget(e.target); } if (e.target.id === "b-edit" && e.key === "Escape") { editBudget = null; render(false); } });
document.addEventListener("focusout", (e) => { if (e.target.id === "b-edit" && editBudget) commitBudget(e.target); });
document.addEventListener("input", (e) => {
  if (e.target.id === "u-q") { uf.q = e.target.value; uMsg = null; const pos = e.target.selectionStart; render(false); const i = $("#u-q"); i.focus(); i.setSelectionRange(pos, pos); }
  if (e.target.id === "f-q") { filt.q = e.target.value; const pos = e.target.selectionStart; render(false); const i = $("#f-q"); i.focus(); i.setSelectionRange(pos, pos); }
  if (e.target.id === "t-desc" && $("#t-cat") && !$("#t-cat").dataset.touched) { const c = SB.keywordSlug(e.target.value, txType === "INCOME" ? "INCOME" : "EXPENSE") || (S.memory[SB.keyOf(e.target.value)] ?? ""); $("#t-cat").value = c; $("#t-sug").hidden = !c; }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "f-cat") { filt.cat = e.target.value; render(false); }
  if (["u-role", "u-plan", "u-status"].includes(e.target.id)) { uf[e.target.id.slice(2) === "status" ? "status" : e.target.id.slice(2)] = e.target.value; uMsg = null; render(false); }
  if (e.target.name === "u-role") { $("#uf-adminwarn").hidden = e.target.value !== "ADMIN"; document.querySelectorAll("input[name=u-role]").forEach((r) => (r.closest("label").style.boxShadow = r.checked ? "0 0 0 2px var(--sobbra)" : "")); }
  if (e.target.id === "f-acc") { filt.acc = e.target.value; render(false); }
  if (e.target.id === "t-cat") e.target.dataset.touched = "1";
  if (e.target.id === "t-rec") { $("#t-recn-wrap").hidden = !e.target.checked; const w = $("#t-inst-wrap"); if (w) w.hidden = e.target.checked; }
  if (e.target.id === "r-from" || e.target.id === "r-to") { rep[e.target.id === "r-from" ? "from" : "to"] = e.target.value; render(false); }
  if (e.target.id === "c-file" && e.target.files[0]) { const f = e.target.files[0];
    const done = (img) => { S.receipts = S.receipts.filter((x) => x.done); S.receipts.push({ id: uid(), name: f.name, img, done: false }); render(); };
    if (f.type.startsWith("image/")) { const rd = new FileReader(); rd.onload = () => { const im = new Image(); im.onload = () => { const k = Math.min(1, 900 / im.width); const cv = document.createElement("canvas"); cv.width = im.width * k; cv.height = im.height * k; cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); done(cv.toDataURL("image/jpeg", 0.7)); }; im.src = rd.result; }; rd.readAsDataURL(f); } else done(null); }
});
document.addEventListener("submit", (e) => {
  e.preventDefault(); const id = e.target.id;
  if (id === "vform") sayVoice($("#v-in").value);
  if (id === "aform") ask($("#a-in").value);
  if (id === "uform") { const err = $("#uf-err"); const name = $("#uf-name").value.trim(), email = $("#uf-email").value.trim().toLowerCase(), phone = $("#uf-phone").value.trim(), plan = $("#uf-plan").value, role = document.querySelector("input[name=u-role]:checked").value;
    const fail = (m) => { err.textContent = m; err.hidden = false; };
    if (name.length < 2) return fail("Informe o nome."); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return fail("E-mail inválido.");
    if (S.users.some((x) => x.email === email && x.id !== uEdit)) return fail("Já existe um usuário com esse e-mail.");
    if (uEdit) { const u = S.users.find((x) => x.id === uEdit);
      if (u.role === "ADMIN" && role !== "ADMIN") { if (u.id === ME()?.id) return fail("Você não pode tirar o seu próprio acesso de administrador."); if (activeAdmins(u.id) === 0) return fail("O sistema precisa de pelo menos um administrador ativo."); }
      const L = { name: "nome", email: "e-mail", phone: "telefone", role: "papel", plan: "plano" }; const ch = Object.keys(L).filter((k) => u[k] !== { name, email, phone, role, plan }[k]);
      Object.assign(u, { name, email, phone, role, plan }); if (ch.length) usersAudit("update", email, `Alterou: ${ch.map((k) => L[k]).join(", ")}`); uMsg = ch.length ? "Alterações salvas." : "Nada mudou."; uTemp = null; }
    else { const u = { id: uid(), name, email, phone, role, plan, created: todayIso, last: null, tx: 0, active: true, mustChange: true }; S.users.unshift(u); usersAudit("create", email, role === "ADMIN" ? "Administrador" : "Cliente"); uNew = false; uEdit = u.id; uTemp = { email, pw: genTemp() }; uMsg = "Usuário cadastrado."; }
    save(); render(false); window.scrollTo(0, 0); }
  if (id === "evform") { const title = $("#e-title").value.trim(); if (!title) { $("#e-title").focus(); return; }
    S.events ||= []; S.events.push({ id: uid(), title, type: $("#e-type").value, date: $("#e-date").value || todayIso, time: $("#e-time").value, amount: SB.parseMoney($("#e-amount").value || "") || undefined });
    agSel = $("#e-date").value || todayIso; agMonth = agSel.slice(0, 7); evForm = false; save(); render(false); toast("Salvo na agenda."); }
  if (id === "txform") {
    const amount = SB.parseMoney($("#t-amount").value || ""); const err = $("#t-err");
    if (!amount || amount <= 0) { err.textContent = "Informe o valor, por exemplo 45,90."; err.hidden = false; return; }
    const raw = $("#t-desc").value.trim() || (txType === "INCOME" ? "Entrada" : txType === "TRANSFER" ? "Transferência" : "Gasto"); const known = SB.normalizeMerchant(raw); const desc = /^[A-Z]/.test(known) && known !== raw.toLowerCase().replace(/(^|\s)\S/g, (c) => c.toUpperCase()) ? known : raw.charAt(0).toUpperCase() + raw.slice(1);
    let ids;
    if (txType === "TRANSFER") { if ($("#t-acc").value === $("#t-to").value) { err.textContent = "Escolha contas diferentes."; err.hidden = false; return; } ids = createTx({ type: "TRANSFER", amount, desc, acc: $("#t-acc").value, to: $("#t-to").value, date: todayIso }); }
    else { const cat = $("#t-cat").value || classify(desc, txType).cat; const rec = $("#t-rec")?.checked; ids = createTx({ type: txType, amount, desc, merchant: desc, cat, acc: $("#t-acc").value, date: $("#t-date").value || todayIso, insts: rec ? 1 : Number($("#t-inst")?.value || 1), rec, recN: rec ? Number($("#t-recn").value) : 0 }); if (rec) { recDefault = false; render(false); toast(`Pronto! ${desc} lançado e agendado por ${$("#t-recn")?.value || 12} meses.`); return; } }
    const wasIncome = txType === "INCOME"; render(false); $("#t-amount").focus(); if (navigator.vibrate) navigator.vibrate(20);
    toast("Movimento salvo.", () => { S.tx.forEach((t) => { if (ids.includes(t.id)) t.deleted = true; }); save(); }); if (wasIncome) coins(30);
  }
  if (id === "cform") {
    const amount = SB.parseMoney($("#c-amount").value || ""); if (!amount) { const er = $("#c-err"); er.textContent = "Confira o valor do comprovante."; er.hidden = false; return; }
    const merchant = SB.normalizeMerchant($("#c-merchant").value.trim() || "Comprovante"); const cat = $("#c-cat").value || classify(merchant, "EXPENSE").cat;
    createTx({ type: "EXPENSE", amount, desc: merchant, merchant, cat, acc: $("#c-acc").value, date: $("#c-date").value, origin: "RECEIPT" });
    const r = S.receipts.find((x) => !x.done); r.done = true; r.merchant = merchant; r.amount = amount; delete r.img; save(); render(false); toast("Lançado a partir do comprovante.");
  }
});
